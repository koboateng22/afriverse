# Supabase CLI config. Anything not listed uses the CLI defaults.
project_id = "afriversity"

[auth]
site_url = "http://localhost:5173"
# /update-password is where password-reset emails land.
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://localhost:5173/update-password"]
# Matches the signup form's rule.
minimum_password_length = 8

# Per IP. Supabase counts sign-ins and sign-ups per 5-minute window:
# 25 per 5 minutes ≈ 5 attempts a minute. The hosted project uses the values in
# Dashboard → Authentication → Rate Limits; set the same there.
[auth.rate_limit]
sign_in_sign_ups = 25

[auth.email]
enable_confirmations = true
# Emails carry an 8-digit code ({{ .Token }}) instead of a link, so they work on any
# device or browser. Keep these in step with the hosted project:
# Dashboard → Authentication → Sign In / Providers → Email (OTP length, OTP expiry).
otp_length = 8
otp_expiry = 3600
# One email per address per minute (the app's "Send a new code" cooldown matches).
max_frequency = "60s"

# Local templates. The hosted project uses Dashboard → Authentication → Emails
# (or `node scripts/push-email-templates.mjs`, which uploads these same files).
[auth.email.template.confirmation]
subject = "Your Afriversity confirmation code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your Afriversity sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Your Afriversity password reset code"
content_path = "./supabase/templates/recovery.html"

# Phone (SMS) sign-in is switched off: email + password, email codes and Google only.
# Hosted project: Dashboard → Authentication → Sign In / Providers → Phone → off.
[auth.sms]
enable_signup = false

# Paystack signs its webhooks (HMAC-SHA512); it never sends a Supabase JWT.
[functions.paystack-webhook]
verify_jwt = false

# Called by the scheduler with the service-role key as the bearer token.
[functions.subscription-cron]
verify_jwt = true
